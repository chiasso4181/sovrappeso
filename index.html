<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ISTRUZIONI ANTI-CACHE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Calcolo Sovraccarichi Veicoli</title>
    
    <!-- LIBRERIA PER GENERARE IL PDF SU MOBILE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #1F4E79; 
            --yellow-bg: #FFF2CC; 
            --yellow-border: #D6B656;
            --bg-color: #F4F7F6;
            --border: #DEE2E6;
            --text-grey: #666666;
        }
        body {
            font-family: Arial, 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #FFF;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* --- STILI INTESTAZIONE UFFICIALE (NASCOSTA A SCHERMO) --- */
        .header-ufficiale {
            display: none; 
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            color: var(--text-grey);
            font-size: 0.85rem;
            line-height: 1.3;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-right {
            text-align: left;
        }
        .header-right strong {
            color: #444;
        }

        /* --- STILI PIÈ DI PAGINA UFFICIALE (NASCOSTO A SCHERMO) --- */
        .footer-ufficiale {
            display: none; 
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #CCC;
            color: var(--text-grey);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.6rem;
            margin-top: 10px;
        }
        h2 {
            font-size: 1.15rem;
            color: var(--primary);
            border-bottom: 1px solid #EEE;
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        
        .form-row { display: flex; align-items: center; margin-bottom: 10px; }
        .form-row label { flex: 1; min-width: 320px; font-weight: 500; }
        .input-wrapper { flex: 1; max-width: 300px; position: relative; display: flex; align-items: center; }
        .input-wrapper input, .input-wrapper select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border);
            border-radius: 4px; font-size: 1rem; font-family: inherit; box-sizing: border-box;
        }

        ::placeholder { color: #A0A0A0; font-weight: normal; }

        .input-yellow { background-color: var(--yellow-bg) !important; font-weight: bold; color: #000; border: 1px solid var(--yellow-border) !important; }
        .input-yellow:focus { outline: none; box-shadow: 0 0 0 3px rgba(214, 182, 86, 0.3); }
        
        .input-white { background-color: #FFF !important; color: #333; }
        .input-white:focus { outline: none; box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.2); border-color: var(--primary); }

        .text-right { text-align: right; }
        .fw-bold { font-weight: bold; }
        .text-red { color: #D35400; }
        .text-green { color: #27AE60; }
        
        .unit-sign { position: absolute; right: 12px; font-weight: bold; color: #333; pointer-events: none; }
        .has-unit { padding-right: 35px !important; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; table-layout: auto; }
        th, td { border: 1px solid var(--border); padding: 10px 12px; vertical-align: middle; }
        th { background-color: #F1F3F5; color: var(--primary); text-align: left; }

        .btn-print {
            display: block; width: 100%; max-width: 350px; margin: 30px auto 10px auto;
            background-color: var(--primary); color: white; border: none; padding: 15px;
            font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center;
        }
        .btn-print:hover { background-color: #112d47; }

        .police-box {
            display: none; 
            margin-top: 25px; 
            border: 2px solid var(--border); 
            border-radius: 8px; 
            padding: 15px 20px; 
            justify-content: space-between; 
            align-items: center; 
            page-break-inside: avoid; 
            background-color: #FAFAFA;
        }
        .police-box h3 {
            margin-top: 0; 
            color: var(--primary); 
            font-size: 1.1rem;
            border: none;
            padding: 0;
        }

        /* -----------------------------------------------------------
           REGOLE MOBILE (Non toccate, funzionano perfettamente)
           ----------------------------------------------------------- */
        .modalita-pdf #contenuto-report {
            width: 750px !important;       
            max-width: 750px !important;
            padding: 10px 25px !important; 
            margin: 0 auto !important;
            box-sizing: border-box !important;
        }
        .modalita-pdf .header-ufficiale { margin-bottom: 10px !important; padding-bottom: 10px !important; }
        .modalita-pdf h1 { margin-bottom: 5px !important; margin-top: 0px !important; font-size: 1.3rem !important; }
        .modalita-pdf h2 { margin-top: 10px !important; margin-bottom: 5px !important; font-size: 1.05rem !important; padding-bottom: 3px !important; }
        .modalita-pdf .form-row { margin-bottom: 3px !important; }
        .modalita-pdf .input-wrapper input, .modalita-pdf .input-wrapper select { padding: 5px 8px !important; }
        .modalita-pdf th, .modalita-pdf td { padding: 5px 8px !important; }
        .modalita-pdf .police-box { margin-top: 10px !important; padding: 10px 15px !important; }
        .modalita-pdf .footer-ufficiale { 
            margin-top: 10px !important; 
            padding-top: 5px !important; 
            font-size: 0.75rem !important; 
            line-height: 1.2 !important;   
        }

        /* -----------------------------------------------------------
           NUOVE REGOLE DI STAMPA PER PC (OTTIMIZZATE PER FOGLIO A4)
           Queste regole "allargano" e spaziano meglio il documento su Windows.
           ----------------------------------------------------------- */
        @media print {
            @page { size: A4 portrait; margin: 1.2cm; } /* Margine del foglio leggermente più ampio per eleganza */
            
            /* Aumentiamo il font di base da 9pt a 11pt per occupare più spazio in verticale */
            body { background: #FFF; padding: 0; margin: 0; font-size: 11pt; } 
            
            .container { box-shadow: none; border: none; padding: 0; max-width: 100%; width: 100%; page-break-inside: avoid; }
            .btn-print { display: none !important; }
            
            .header-ufficiale { display: flex !important; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--primary); }
            
            /* Diamo molto più spazio sopra il footer per spingerlo in basso */
            .footer-ufficiale { display: block !important; margin-top: 50px; padding-top: 15px; font-size: 10pt; }
            
            /* Titoli più grandi e più distanziati */
            h1 { margin-bottom: 25px; padding-bottom: 10px; font-size: 1.6rem; margin-top: 10px; }
            h2 { margin-top: 30px; margin-bottom: 15px; padding-bottom: 5px; font-size: 1.2rem; }
            
            /* Aumentiamo lo spazio tra le righe del modulo */
            .form-row { margin-bottom: 12px; } 
            
            table { margin-top: 10px; }
            
            /* Celle delle tabelle più "alte" e con testo più grande */
            th, td { padding: 8px 10px !important; font-size: 10.5pt !important; } 
            
            .table-responsive { overflow: visible !important; }
            table { table-layout: fixed !important; width: 100% !important; word-wrap: break-word; }
            th, td { border: 1px solid #000 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            
            .input-wrapper input, .input-wrapper select { border: 1px solid #CCC !important; background: transparent !important; padding: 6px; font-size: 11pt; }
            .input-yellow { background-color: #FFF2CC !important; border: 1px solid #D6B656 !important; }
            th { background-color: #E9ECEF !important; }
            
            /* Spingiamo verso il basso il box della polizia cantonale e lo rendiamo un po' più grande */
            .police-box { 
                display: flex !important; 
                margin-top: 40px; 
                border: 2px solid #000 !important; 
                background-color: #FFF !important; 
                padding: 15px 20px; 
            }
        }
        
        /* Il layout mobile si disattiva se siamo in modalità PDF */
        @media (max-width: 600px) {
            body:not(.modalita-pdf) .header-ufficiale { flex-direction: column; gap: 15px; }
            body:not(.modalita-pdf) .form-row { flex-direction: column; align-items: stretch; }
            body:not(.modalita-pdf) .form-row label { margin-bottom: 5px; }
            body:not(.modalita-pdf) .input-wrapper { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="contenuto-report">
    
    <!-- INTESTAZIONE UFFICIALE -->
    <div class="header-ufficiale" id="header-stampa">
        <div class="header-left">
            <svg width="45" height="55" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,10 v40 c0,30 40,60 40,60 c0,0 40,-30 40,-60 v-40 z" fill="#888888"/>
